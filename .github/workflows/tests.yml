name: tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/tests.yml"
  push:
    branches: [unstable]
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/tests.yml"
  schedule:
    # Nightly at 18:00 UTC (02:00 Asia/Shanghai).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  llm:
    name: AxonHub.Llm.Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/AxonHub.Llm.Tests/AxonHub.Llm.Tests.csproj -c Release

  grains:
    name: AxonHub.Grains.Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/AxonHub.Grains.Tests/AxonHub.Grains.Tests.csproj -c Release

  persistence:
    name: AxonHub.Persistence.Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # ubuntu-latest provides a Docker daemon; Testcontainers starts
      # postgres:17-alpine for each test schema.
      - run: dotnet test tests/AxonHub.Persistence.Tests/AxonHub.Persistence.Tests.csproj -c Release

  api:
    name: AxonHub.Api.Tests (nightly)
    # The full Api suite takes ~42 minutes and includes timing-sensitive
    # safeguards cases, so it runs nightly/manual instead of on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/AxonHub.Api.Tests/AxonHub.Api.Tests.csproj -c Release

  e2e-llm:
    name: LlmTestServer E2E
    # Real-provider wire matrix. The deterministic LlmTestServer image supplies
    # OpenAI/Anthropic/Gemini/Responses/Groq/Ollama/DeepSeek/OpenRouter routes;
    # the gateway, orchestrator, transformers and HttpExecutor run for real.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      llm_test_server:
        # Pin both the release tag and its multi-arch index digest.
        image: ghcr.io/managedcode/llm-test-server:1.0.6@sha256:ca9d1dc11bbd362969e756145b075f3269234d18f31f2d997217789edffc2d5b
        ports:
          - 8080:8080
        env:
          LlmTestServer__RequiredBearerToken: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Wait for LlmTestServer
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Authorization: Bearer test-key' \
                http://localhost:8080/admin-api/models >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "LlmTestServer did not become ready"
          docker logs "${{ job.services.llm_test_server.id }}" || true
          exit 1
      - name: Run the real-provider matrix
        env:
          AXONHUB_E2E_LLM_TEST_SERVER_URL: http://localhost:8080
          AXONHUB_E2E_LLM_TEST_SERVER_KEY: test-key
        run: >-
          dotnet test tests/AxonHub.Api.Tests/AxonHub.Api.Tests.csproj
          -c Release
          --filter FullyQualifiedName~LlmTestServer
