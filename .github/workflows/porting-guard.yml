name: porting-guard

on:
  pull_request:
    paths:
      - "porting/**"
      - "corpus/**"
      - "tools/AxonHub.CorpusRunner/**"
      - "src/AxonHub.Llm/**"
      - "src/AxonHub.Abstractions/**"
      - ".github/workflows/porting-guard.yml"
  push:
    branches: [unstable]
    paths:
      - "porting/**"
      - "corpus/**"
      - "tools/AxonHub.CorpusRunner/**"
      - "src/AxonHub.Llm/**"
      - "src/AxonHub.Abstractions/**"
      - ".github/workflows/porting-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: difference ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the difference ledger
        run: python -I porting/scripts/diff_register.py lint --dir porting
      - name: Verify 02-differences.md is current
        run: |
          python -I porting/scripts/diff_register.py render --dir porting
          git diff --exit-code -- porting/02-differences.md

  corpus:
    name: differential corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the corpus runner
        run: dotnet build tools/AxonHub.CorpusRunner/AxonHub.CorpusRunner.csproj -c Release
      - name: Verify the four corpus families
        shell: bash
        run: |
          set -euo pipefail
          runner="dotnet tools/AxonHub.CorpusRunner/bin/Release/net10.0/AxonHub.CorpusRunner.dll"
          for mode in upstream-request unified-request client-response client-stream; do
            echo "::group::corpus/$mode"
            python -I porting/scripts/diff_corpus.py verify \
              --cmd "$runner --mode $mode" \
              --corpus "corpus/$mode"
            echo "::endgroup::"
          done

  reference:
    name: reference lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the locked upstream commit
        run: |
          git clone --depth 1 --branch v1.0.0-beta11 \
            https://github.com/looplj/axonhub.git "$RUNNER_TEMP/axonhub-ref"
          python -I porting/scripts/reference_lock.py check \
            --repo "$RUNNER_TEMP/axonhub-ref" \
            --dest porting/reference-lock.json
