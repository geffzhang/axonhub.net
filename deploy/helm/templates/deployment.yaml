{{- $clusterEnabled := eq (include "axonhub.clusterEnabled" . | trim) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axonhub.fullname" . }}
  labels:
    {{- include "axonhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: axonhub
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.axonhub.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "axonhub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: axonhub
  template:
    metadata:
      {{- if or .Values.axonhub.config.content .Values.axonhub.podAnnotations }}
      annotations:
        {{- if .Values.axonhub.config.content }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.axonhub.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "axonhub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: axonhub
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.axonhub.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "axonhub.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.axonhub.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "axonhub.postgresql.serviceName" . }} {{ .Values.postgresql.service.port }}; do echo waiting for postgresql; sleep 2; done
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.axonhub.securityContext | nindent 12 }}
          image: "{{ .Values.axonhub.image.repository }}:{{ .Values.axonhub.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.axonhub.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.axonhub.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.axonhub.environment | quote }}
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ .Values.axonhub.service.port | quote }}
            - name: DOTNET_EnableDiagnostics
              value: "0"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            {{- if .Values.axonhub.database.existingSecret }}
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.axonhub.database.existingSecret }}
                  key: {{ .Values.axonhub.database.existingSecretKey }}
            {{- else }}
            - name: ConnectionStrings__Default
              value: {{ include "axonhub.databaseDsn" . | quote }}
            {{- end }}
            {{- if $clusterEnabled }}
            - name: ORLEANS_CLUSTER_ENABLED
              value: "true"
            - name: ORLEANS_CLUSTER_ID
              value: {{ .Values.axonhub.cluster.clusterId | quote }}
            - name: ORLEANS_CLUSTER_SERVICE_ID
              value: {{ .Values.axonhub.cluster.serviceId | quote }}
            - name: ORLEANS_CLUSTER_SILO_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ORLEANS_CLUSTER_ADVERTISED_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ORLEANS_CLUSTER_SILO_PORT
              value: {{ .Values.axonhub.cluster.siloPort | quote }}
            - name: ORLEANS_CLUSTER_GATEWAY_PORT
              value: {{ .Values.axonhub.cluster.gatewayPort | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.axonhub.service.port }}
              protocol: TCP
            {{- if $clusterEnabled }}
            - name: orleans
              containerPort: {{ .Values.axonhub.cluster.siloPort }}
              protocol: TCP
            {{- end }}
          {{- if .Values.axonhub.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.axonhub.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.axonhub.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.axonhub.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.axonhub.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.axonhub.config.content }}
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.axonhub.config.content }}
        - name: config
          configMap:
            name: {{ include "axonhub.fullname" . }}-config
        {{- end }}
      {{- with .Values.axonhub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.axonhub.affinity }}
      affinity:
        {{- toYaml .Values.axonhub.affinity | nindent 8 }}
      {{- else if $clusterEnabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "axonhub.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: axonhub
      {{- end }}
      {{- with .Values.axonhub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
