apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "axonhub.fullname" . }}-test-connection"
  labels:
    {{- include "axonhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ['wget']
      args:
        - '-q'
        - '-O'
        - '-'
        - 'http://{{ include "axonhub.fullname" . }}:{{ .Values.axonhub.service.port }}/health'
